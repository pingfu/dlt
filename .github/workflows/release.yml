name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test

  publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, win-x86, win-arm64, linux-x64, linux-arm, linux-arm64, linux-musl-x64, linux-musl-arm64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src -c Release -r ${{ matrix.rid }} -p:Version=$VERSION -o out
      - run: cd out && mv dlt* dlt-${{ matrix.rid }}${{ startsWith(matrix.rid, 'win') && '.exe' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: out/dlt-*

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create v$VERSION dist/* --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
